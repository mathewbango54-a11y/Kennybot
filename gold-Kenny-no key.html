<!DOCTYPE html>
<html><head><title>KENNY GOLD 👑 NO KEY V2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{background:#0f0f0f;color:#fff;font-family:Arial;padding:12px}
.card{background:#1a1a1a;border:1px solid #FFD700;border-radius:12px;padding:14px;margin-bottom:10px}
.gold{color:#FFD700}.green{color:#00ff88}.red{color:#ff4444}.yellow{color:#ffcc00}
button{background:#FFD700;color:#000;border:none;padding:12px;width:100%;border-radius:10px;font-weight:900}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none}</style>
</head><body>
<h2 class="gold">KENNY 👑 GOLD - NO SIGN-UP V2</h2>
<p>XAU/USD - 4 APIs NO KEY - FOLLOW THE SYSTEM</p>

<div class="card">
<button onclick="checkGold()">🔄 CHECK GOLD - 4 APIs NO KEY</button>
<p id="price"><b>Price: ---</b></p>
<p id="apis">APIs: Waiting...</p>
</div>

<div class="card"><b>📅 YESTERDAY RANGE</b>
<p>Y High <input id="yh" value="3685.39"> Y Low <input id="yl" value="3557.68"></p>
<p id="range"></p></div>

<div class="card"><b>📊 3 TIMEFRAMES EMA 9/21</b>
M15 <select id="m15"><option>BUY</option><option>SELL</option><option>WAIT</option></select>
M30 <select id="m30"><option>BUY</option><option>SELL</option><option>WAIT</option></select>
H1 <select id="h1"><option>BUY</option><option>SELL</option><option>WAIT</option></select>
<button onclick="getSignal()">KENNY CHECK + SIGNAL</button>
<h3 id="signal">---</h3><p id="plan"></p></div>

<div class="card"><b>Balance R200 | Losses 0/2</b><br>
<button onclick="alert('WIN +R20 logged')">✅ I WON +R20</button><br><br>
<button onclick="alert('LOSS -R20 logged')">❌ I LOST -R20</button>
<p>RULES: 1) Only BUY/SELL 2x 2) WAIT = NO TRADE 3) 2 Losses = STOP TODAY</p></div>

<script>
let goldPrice=3666;
async function checkGold(){
 let prices=[], logs=[];
 // 1. XAUS - NO KEY
 try{let r=await fetch('https://xaus.com/api/v1/spot');let j=await r.json();
  let p=j.spot_usd_oz||j.xau?.price||j.price; if(p){prices.push(p);logs.push('XAUS $'+p.toFixed(2));}
 }catch(e){logs.push('XAUS FAIL');}
 // 2. GoldPrice.org - NO KEY
 try{let r=await fetch('https://data-asg.goldprice.org/dbXRates/USD');let j=await r.json();
  let p=parseFloat(j.items[0].xauPrice); prices.push(p);logs.push('GoldPrice.org $'+p.toFixed(2));
 }catch(e){logs.push('GoldPrice.org FAIL');}
 // 3. BiQuote - NO KEY - BEST
 try{let r=await fetch('https://biquote.io/api/latest?symbols=XAUUSD');let j=await r.json();
  let d=j.data?.XAUUSD||j.XAUUSD||Object.values(j)[0];
  let p=d?.mid||d?.price||(d?.bid+d?.ask)/2; if(p){prices.push(p);logs.push('BiQuote $'+p.toFixed(2));}
 }catch(e){logs.push('BiQuote FAIL');}
 // 4. BullionPriceCheck - NO KEY
 try{let r=await fetch('https://bullionpricecheck.com/api/v1/spot');let j=await r.json();
  let p=j.gold?.spot||j.spot?.gold||j.gold; if(p){prices.push(parseFloat(p));logs.push('Bullion $'+parseFloat(p).toFixed(2));}
 }catch(e){logs.push('Bullion FAIL');}

 if(prices.length>=2){
  goldPrice=prices.reduce((a,b)=>a+b,0)/prices.length;
  document.getElementById('price').innerHTML='<b>CONFIRMED: $'+goldPrice.toFixed(2)+'</b> | '+new Date().toLocaleTimeString()+' ✅';
  document.getElementById('apis').innerHTML=logs.join(' | ')+' | '+prices.length+'/4 CONFIRMED';
 } else {
  document.getElementById('apis').innerHTML='Only '+prices.length+' API replied - Kenny says WAIT. Try again in 1 min. | '+logs.join(' | ');
 }
 let yh=parseFloat(document.getElementById('yh').value),yl=parseFloat(document.getElementById('yl').value);
 document.getElementById('range').innerHTML='Range $'+(yh-yl).toFixed(2)+' | Resistance $'+yh+' | Support $'+yl+' | Mid $'+((yh+yl)/2).toFixed(2);
}
function getSignal(){
 let a=[document.getElementById('m15').value,document.getElementById('m30').value,document.getElementById('h1').value];
 let buys=a.filter(x=>x=='BUY').length, sells=a.filter(x=>x=='SELL').length;
 let s=document.getElementById('signal'),p=document.getElementById('plan');
 if(buys>=2){s.innerHTML='<span class=green>🟢 BUY CONFIRMED 2x - TRADE</span>';p.innerHTML='<b>Entry $'+goldPrice.toFixed(2)+' | Target $'+(goldPrice+15).toFixed(2)+' | Stop $'+(goldPrice-7.5).toFixed(2)+'</b><br>Risk R20 | 0.03 Lot';}
 else if(sells>=2){s.innerHTML='<span class=red>🔴 SELL CONFIRMED 2x - TRADE</span>';p.innerHTML='<b>Entry $'+goldPrice.toFixed(2)+' | Target $'+(goldPrice-15).toFixed(2)+' | Stop $'+(goldPrice+7.5).toFixed(2)+'</b><br>Risk R20 | 0.03 Lot';}
 else{s.innerHTML='<span class=yellow>🟡 WAIT - DO NOT TRADE</span>';p.innerHTML='Entry --- | Target --- | Stop ---';}
}
checkGold();
</script></body></html>
